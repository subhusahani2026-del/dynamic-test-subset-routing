name: Dynamic Test Subset Routing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Identify changed files
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "No previous commit found. Running all tests."
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" "$GITHUB_SHA" > changed_files.txt
            echo "Changed files:"
            cat changed_files.txt
          fi

      - name: Run selected tests
        run: |
          if [ "${{ steps.changes.outputs.all }}" = "true" ]; then
            python -m pytest -v
          else
            mapfile -t changed_files < changed_files.txt
            python scripts/route_tests.py "${changed_files[@]}"
          fi